name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit:
    name: Unit tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 22 = oldest supported (maintenance LTS to 2027-04); 24/26 = active LTS.
        # Node 20 dropped: end-of-life since 2026-04-30.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # If better-sqlite3 has no win32 prebuilt for a matrix Node, npm compiles it
      # from source, and an old bundled node-gyp (<10.2) crashes finding the
      # runner's VS 2026 install (ERR_CHILD_PROCESS_STDIO_MAXBUFFER, "unknown
      # version undefined"). This bit the old Node 20 cell. Refreshing npm keeps a
      # modern node-gyp on every Windows cell in case a new Node major lands before
      # its prebuilt does. Pinned to npm 11, not @latest: npm 12 skips dependency
      # install scripts by default, so better-sqlite3's native binding would never
      # be built.
      - name: Modernize node-gyp toolchain (Windows)
        if: runner.os == 'Windows'
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: Integration tests (Docker / Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:int
